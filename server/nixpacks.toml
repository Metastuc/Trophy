[phases.setup]
nixPkgs = ["nodePackages_latest.nodejs"]

[phases.install]
cmds = [
  "echo '--- PACKAGE.JSON CONTENTS ---'",
  "cat package.json",
  "echo '--- NODE VERSION ---'",
  "node -v",
  "echo '--- NPM VERSION ---'",
  "npm -v",
  "npm install --legacy-peer-deps --omit=dev",
  "echo '--- INSTALLED FLAUNCH SDK VERSION ---'",
  "cat node_modules/@flaunch/sdk/package.json | grep 'version'",
  "echo '--- FLAUNCH SDK EXPORTS (TOP OF INDEX FILE) ---'",
  "head -n 40 node_modules/@flaunch/sdk/dist/index.js || true",
  "npm run migrate",
]

[start]
cmd = "npm start"
