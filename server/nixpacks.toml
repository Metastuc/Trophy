[phases.setup]
nixPkgs = ["nodePackages_latest.nodejs"]

[phases.install]
cmds = [
  "echo '--- PACKAGE.JSON CONTENTS ---'",
  "cat package.json",
  "echo '--- NODE VERSION ---'",
  "node -v",
  "echo '--- NPM VERSION ---'",
  "npm -v",
  "npm install --legacy-peer-deps --omit=dev",
  "npm run migrate",
]

[start]
cmd = "npm start"
