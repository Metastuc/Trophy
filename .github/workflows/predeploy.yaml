name: Pre-deployment checks (staging)

on:
    push:
        branches: [staging]
    pull_request:
        branches: [staging]

jobs:
    test-and-build:
        runs-on: ubuntu-latest

    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up PNPM
          uses: pnpm/action-setup@v4
          with:
              version: 10

        - name: Set up Node
          uses: actions/setup-node@v4
          with:
              node-version: 24
              cache: "pnpm"

        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        - name: Build app
          run: pnpm build
